# Eine Quelle für den Kurs (Architektur-Vertrag, Abschnitte 2 und 16). Plan nach KONZEPT.md, Stand 2026-11-23.
#
# semester   die zwei Semester.
# einheiten  der Stoff: Programmierstrang P1–P11 und Theoriestrang T1–T11.
#            bloecke: Blöcke à 30 Minuten im ganzen Kurs (wird gegen die Termine geprüft).
#            stoff:   Lektionen des bisherigen Kurses, aus denen die Einheit entsteht (KONZEPT-MIGRATION.md, Abschnitt 7).
#                     Ohne stoff wird die Einheit neu gebaut.
# termine    die 20 Termine in Kursreihenfolge, je Termin 4 Blöcke (theorie, programmieren, puffer).
#            lektion:  Kennung der eigenen Seiten des Termins, sobald es sie gibt (Eintrag unter lektionen).
#            freigabe: Datum (JJJJ-MM-TT) oder weglassen.
# lektionen  Seiten, die es gibt: die fertigen Termine (bisher V01 = Termin 01) und, bis sie ersetzt sind,
#            die bleibenden Lektionen des bisherigen Kurses.
#            Dateinamen sind die Adressen unter lektionen/; die Quelle liegt in app/inhalte/vNN/ (MDX) oder site/lektionen/.
#            Fehlt eine genannte Datei, bricht der Build ab (src/lib/kurs.mjs).
#            aktiv: false schaltet eine Lektion ab: Ihre Seiten werden noch gebaut, aber nirgends angeboten
#            (nicht im Lernpfad, nicht im Lektionswähler, nicht in Heute, Suche, Glossar und Kursübersicht).

semester:
  - nr: 1
    name: 1. Semester
    bereich: Termin 01 bis 10
    leitsatz: Erst der Ablauf, dann der Code. Am Ende steht dein erstes Spiel, Zahlenraten.
  - nr: 2
    name: 2. Semester
    bereich: Termin 11 bis 20
    leitsatz: Listen, Messwerte und ein Spielfeld. Am Ende baust du Schiffe versenken gegen den Computer.

einheiten:
  P1: { name: "Variablen, Ein- und Ausgabe, Ausgabe formatieren", kurz: "Variablen, Ein- und Ausgabe", bloecke: 3 }
  P2: { name: Verzweigungen, kurz: Verzweigungen, bloecke: 4, stoff: [V04] }
  P3: { name: "Schleifen (while, for)", kurz: Schleifen, bloecke: 7, stoff: [V06] }
  P4: { name: "Funktionen, lokale und globale Namen", kurz: Funktionen, bloecke: 6, stoff: [V07] }
  P5: { name: "Zahlenraten: erstes vollständiges Spiel", kurz: Zahlenraten, bloecke: 4 }
  P6: { name: Auffrischer nach der Praxisphase, kurz: Auffrischer Programmieren, bloecke: 2 }
  P7: { name: Listen, kurz: Listen, bloecke: 6, stoff: [V08] }
  P8: { name: "Messwerte auswerten: Datei lesen, Mittelwert, Minimum, Maximum, Diagramm nach Vorlage", kurz: Messwerte auswerten, bloecke: 3, stoff: [V09, V14] }
  P9: { name: "Raster (Liste in Liste)", kurz: Raster, bloecke: 2 }
  P10: { name: Schiffe versenken gegen den Computer, kurz: Schiffe versenken, bloecke: 9 }
  P11: { name: Klausurtraining Programmierteil, kurz: Klausurtraining Programmieren, bloecke: 2, stoff: [V22] }
  T1: { name: "Problemanalyse, Algorithmus, PAP-Symbole", kurz: Problemanalyse und PAP, bloecke: 2 }
  T2: { name: "Boolesche Logik: und, oder, nicht, Wahrheitstabelle", kurz: Boolesche Logik, bloecke: 3, stoff: [V04] }
  T3: { name: "Zahlensysteme: dezimal, binär, hexadezimal", kurz: Zahlensysteme, bloecke: 4, stoff: [V02] }
  T4: { name: Bitoperationen, kurz: Bitoperationen, bloecke: 1, stoff: [V02] }
  T5: { name: "Datentypen, Kommazahlen und ihre Genauigkeit", kurz: Datentypen, bloecke: 3, stoff: [V03] }
  T6: { name: Aufbau und Funktion eines Rechners, kurz: Rechneraufbau, bloecke: 3, stoff: [V16] }
  T7: { name: Auffrischer Pflichttheorie, kurz: Auffrischer Theorie, bloecke: 1 }
  T8: { name: Wie funktioniert KI?, kurz: Wie funktioniert KI?, bloecke: 3, stoff: [V10] }
  T9: { name: Datenbanken, kurz: Datenbanken, bloecke: 3, stoff: [V19] }
  T10: { name: Netzwerke und IT-Sicherheit, kurz: Netzwerke und IT-Sicherheit, bloecke: 5, stoff: [V17, V18] }
  T11: { name: Klausurtraining Theorieteil, kurz: Klausurtraining Theorie, bloecke: 2, stoff: [V22] }

termine:
  - { nr: 1,  theorie: { T1: 2 },        programmieren: { P1: 2 }, lektion: V01 }
