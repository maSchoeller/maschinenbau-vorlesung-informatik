# Eine Quelle für den Kurs (Architektur-Vertrag, Abschnitte 2 und 16). Plan nach KONZEPT.md, Stand 2026-11-23.
#
# semester   die zwei Semester.
# einheiten  der Stoff: Programmierstrang P1–P11 und Theoriestrang T1–T11.
#            bloecke: Blöcke à 30 Minuten im ganzen Kurs (wird gegen die Termine geprüft).
#            Alle Einheiten werden neu gebaut; die Lektionen des alten Kurses sind entfernt (2026-11-24).
#            (stoff: [V..] würde Lektionen nennen, die bis zum Neubau als Material zu einem Termin gehören;
#            src/lib/kurs.mjs versteht die Angabe weiter, zurzeit benutzt sie keine Einheit.)
# termine    die 20 Termine in Kursreihenfolge, je Termin 4 Blöcke (theorie, programmieren, puffer).
#            lektion:  Kennung der eigenen Seiten des Termins, sobald es sie gibt (Eintrag unter lektionen).
#                      Zeigt sie auf eine Lektion mit aktiv: false, ist der Termin ein Entwurf: Er gilt wie ein
#                      Termin ohne Seiten (Lernpfad: "Seiten folgen.", kein Verweis), die Seiten bleiben unter
#                      ihrer Adresse aufrufbar (Durchsicht durch den Dozenten). Freischalten = aktiv: false streichen.
#            freigabe: Datum (JJJJ-MM-TT) oder weglassen.
# lektionen  Seiten, die es gibt: die fertigen Termine (bisher V01 bis V05 = Termin 01 bis 05). Termin NN bekommt die Kennung VNN.
#            Dateinamen sind die Adressen unter lektionen/; die Quelle liegt in app/inhalte/vNN/ (MDX).
#            Fehlt eine genannte Datei, bricht der Build ab (src/lib/kurs.mjs).
#            aktiv: false schaltet eine Lektion ab: Ihre Seiten werden noch gebaut, aber nirgends angeboten
#            (nicht im Lernpfad, nicht im Lektionswähler, nicht in Heute, Suche, Glossar und Kursübersicht).
#            Abgeschaltete Lektionen stehen in dist/app/daten/kurs.json nur unter entwuerfe und sind nicht im
#            Precache des Service Workers; pruefe-loesungen.mjs prüft sie trotzdem.
#            Zurzeit ist keine Lektion abgeschaltet. V02 ist seit 2026-11-25 freigeschaltet, V03 bis V05 seit 2026-11-27.

semester:
  - nr: 1
    name: 1. Semester
    bereich: Termin 01 bis 10
    leitsatz: Erst der Ablauf, dann der Code. Am Ende steht dein erstes Spiel, Zahlenraten.
  - nr: 2
    name: 2. Semester
    bereich: Termin 11 bis 20
    leitsatz: Listen, Messwerte und ein Spielfeld. Am Ende baust du Schiffe versenken gegen den Computer.

