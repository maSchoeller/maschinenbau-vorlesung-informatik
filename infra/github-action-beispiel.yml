# Vorbereiteter Workflow für später: Bauen und Bereitstellen von Hand (workflow_dispatch).
# Bewusst NICHT unter .github/workflows – erst nach Freigabe des Dozenten dorthin kopieren:
#   cp infra/github-action-beispiel.yml .github/workflows/lernapp.yml
#
# Voraussetzungen im GitHub-Repository (Settings → Secrets and variables → Actions):
#   Secret   AZURE_STATIC_WEB_APPS_API_TOKEN   Deployment-Token der SWA
#            (einmalig: az staticwebapp secrets list -n <swa-name> -g rg-informatik-lernapp --query properties.apiKey -o tsv
#             direkt in das Secret-Feld kopieren, nirgends sonst ablegen)
#   Variable VIDEO_BASIS                       Ausgabe 'videoBasis' des Bicep-Deployments,
#            z. B. https://<storage>.blob.core.windows.net/video
#   Variable SWA_HOSTNAME                      Ausgabe 'swaHostname' (z. B. <name>.azurestaticapps.net),
#            nur für den Rauchtest; ohne sie wird er übersprungen
# Infrastruktur (Bicep) und damit Salt und Key Vault fasst dieser Workflow nicht an; das bleibt bei
# infra/bereitstellen.ps1 -Schritt Infrastruktur (Salt-Fallunterscheidung, siehe docs/app/BETRIEB.md, Abschnitt 5).
# Er prüft auch nicht, ob Tresor und SWA denselben Salt haben (kein Azure-Login); das tut
# infra/bereitstellen.ps1 -Schritt SaltPruefen, vor einem Ausrollen über diesen Workflow ausführen.
# Videos selbst lädt dieser Workflow nicht hoch (das macht infra/bereitstellen.ps1 -Schritt Videos);
# Git LFS holt deshalb nur die Bilder.
#
# Bewusst KEIN Auslöser bei jedem Push: Jede Bereitstellung ändert die Build-Version, und alle
# installierten Apps laden danach den Precache neu (Bandbreite der SWA Free: 100 GB im Monat, ohne
# Zukauf; siehe docs/app/BETRIEB.md, Abschnitt 2). Ausrollen also gesammelt, z. B. einmal je Termin.

name: Lern-App bereitstellen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lernapp-produktion
  cancel-in-progress: false

jobs:
  bauen_und_bereitstellen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Git LFS nur für Bilder (Videos liegen im Storage-Konto)
        run: git lfs pull --include "site/assets/img/**"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            api/package-lock.json

      - name: App bauen (erzeugt auch api/daten/aufgaben.json)
        working-directory: app
        env:
          VIDEO_BASIS: ${{ vars.VIDEO_BASIS }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/staticwebapp.config.json

      - name: API prüfen
        working-directory: api
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: API-Paket (nur Laufzeitdateien, ohne Tests und lokale Daten; im Arbeitsbereich, weil die Deploy-Action in Docker nur diesen sieht)
        run: |
          mkdir -p api-paket
          cp -r api/host.json api/package.json api/package-lock.json api/src api-paket/
          if [ -d api/daten ]; then cp -r api/daten api-paket/; fi
          cd api-paket && npm ci --omit=dev --no-audit --no-fund

      - name: Bereitstellen (Produktion)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: app/dist
          output_location: ''
          api_location: api-paket
          skip_app_build: true
          skip_api_build: true

      - name: Rauchtest
        run: node api/skripte/rauchtest.mjs "https://${{ vars.SWA_HOSTNAME }}" --erwarte-ablage=cosmos --versuche=6
        if: ${{ vars.SWA_HOSTNAME != '' }}
